name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Gradle Wrapper (9.3.1)
      run: |
        gradle wrapper --gradle-version 9.3.1
        chmod +x gradlew

    - name: Generate Debug Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        mkdir -p app
        cp debug.keystore app/debug.keystore

    - name: Inject Dummy Client ID String
      run: |
        mkdir -p app/src/main/res/values
        if [ -f app/src/main/res/values/strings.xml ]; then
          sed -i 's/<\/resources>/    <string name="default_web_client_id">dummy_client_id<\/string>\n<\/resources>/' app/src/main/res/values/strings.xml
        else
          echo '<resources><string name="default_web_client_id">dummy_client_id</string></resources>' > app/src/main/res/values/strings.xml
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CloudVault-Debug-APK
        path: app/build/outputs/apk/**/*.apk
